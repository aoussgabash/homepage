name: One-time add static 2023 book

on:
  push:
    paths:
      - '.github/workflows/one-time-add-2023-book.yml'

permissions:
  contents: write

jobs:
  add-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert static 2023 card
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'data-editorial-volume="2023"' not in html:
              anchor = '<span>In preparation |'
              anchor_position = html.find(anchor)
              if anchor_position == -1:
                  raise SystemExit('In preparation anchor not found')

              article_position = html.rfind('<article', 0, anchor_position)
              if article_position == -1:
                  raise SystemExit('Article anchor not found')

              card = '''<article class="published-book-card published-book-unified" data-editorial-volume="2023">
            <div class="published-book-gallery">
              <div class="published-book-frame">
                <img src="assets/books/selection-c3-front.jpg" alt="Front cover of Energy Optimization for Sustainable Resilience and Climate Stability – C+++ Framework | الغلاف الأمامي لمجموعة تحسين الطاقة من أجل المرونة المستدامة والاستقرار المناخي" loading="lazy" decoding="async">
              </div>
            </div>
            <span>Published · English · Editorial Collection · 2023 | <span lang="ar" dir="rtl">منشور · بالإنجليزية · مجموعة تحريرية · 2023</span></span>
            <h3>Energy Optimization for Sustainable Resilience and Climate Stability – C+++ Framework<span class="card-ar" lang="ar" dir="rtl">تحسين الطاقة من أجل المرونة المستدامة والاستقرار المناخي – إطار C+++</span></h3>
            <div class="book-meta">
              <p><strong>Editor and Compiler | المحرر والمُعِدّ:</strong> Dr.-Ing. Aouss Gabash | الدكتور المهندس أوس غباش</p>
              <p><strong>Publisher | الناشر:</strong> MDPI</p>
              <p><strong>Publication Year | سنة النشر:</strong> 2023</p>
              <p><strong>Type | النوع:</strong> MDPI Selections · Editorial Collection | مختارات MDPI · مجموعة تحريرية</p>
              <p><strong>Language | اللغة:</strong> English | الإنجليزية</p>
            </div>
            <div class="book-abstract">
              <h4>Abstract | <span lang="ar" dir="rtl">الملخص</span></h4>
              <p>This editorial preface presents the scientific vision of the collection by tracing the evolution of sustainable energy systems and highlighting renewable-energy integration, battery storage, real-time optimal power flow, and the proposed C+++ Framework.</p>
              <p class="ar-copy" lang="ar" dir="rtl">تقدم هذه المقدمة التحريرية الرؤية العلمية للمجموعة من خلال تتبع تطور أنظمة الطاقة المستدامة، وإبراز دمج مصادر الطاقة المتجددة، وتخزين الطاقة، وتدفق الاستطاعة الأمثل الآني، وإطار C+++ المقترح.</p>
            </div>
            <div class="published-book-action">
              <a class="button primary" href="https://archive.org/details/@aouss_gabash" target="_blank" rel="noopener noreferrer">Explore Digital Library | استكشف المكتبة الرقمية</a>
            </div>
          </article>
          '''

              html = html[:article_position] + card + html[article_position:]
              path.write_text(html, encoding='utf-8')
          PY

      - name: Verify result
        run: |
          grep -q 'data-editorial-volume="2023"' index.html
          grep -q 'selection-c3-front.jpg' index.html
          ! grep -q 'featured-editorial.js' index.html
          ! grep -q 'published-book-toggle' index.html

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/one-time-add-2023-book.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-add-2023-book.yml
          git commit -m 'Add 2023 editorial collection as static HTML book card'
          git push
