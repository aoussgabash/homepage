name: One-time static books cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-static-books-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert books section to static HTML/CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove both cover-toggle buttons.
          text = re.sub(
              r'\n\s*<button class="published-book-toggle"[^>]*data-book-toggle>.*?</button>',
              '',
              text,
              flags=re.S,
          )

          # Remove the inline cover-toggle JavaScript block.
          text = re.sub(
              r'\n\s*<script id="published-book-gallery-script">.*?</script>',
              '',
              text,
              flags=re.S,
          )

          # Remove the obsolete external books script reference.
          text = re.sub(
              r'\n\s*<script src="featured-editorial\.js\?v=20260823"></script>\s*',
              '\n',
              text,
          )

          # Remove JavaScript-only data attributes from static cover images.
          text = re.sub(r'\s+data-front="[^"]*"', '', text)
          text = re.sub(r'\s+data-back="[^"]*"', '', text)
          text = re.sub(r'\s+data-side="[^"]*"', '', text)
          text = text.replace(' data-book-gallery', '')

          # Remove unused toggle CSS rules while preserving the shared book layout.
          text = re.sub(
              r'\n\s*\.published-book-toggle\{.*?\}\n\s*\.published-book-toggle:hover,\.published-book-toggle:focus-visible\{.*?\}',
              '',
              text,
              flags=re.S,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify cleanup
        run: |
          ! grep -q 'published-book-gallery-script' index.html
          ! grep -q 'published-book-toggle' index.html
          ! grep -q 'featured-editorial.js' index.html
          grep -q 'illumination-front.jpg' index.html
          grep -q 'flexible-optimal-operations-front.jpg' index.html

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-static-books-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-static-books-cleanup.yml
          git commit -m 'Convert published books section to static HTML and CSS'
          git push
