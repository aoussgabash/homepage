name: Insert About Profile Links

on:
  push:
    paths:
      - '.github/workflows/add-about-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert profile links directly into index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<p lang="ar" dir="rtl" class="ar-text">تشمل الاهتمامات البحثية والتعليمية أنظمة القدرة الكهربائية والطاقة الذكية والمستدامة والتحسين والتحكم وتخزين الطاقة ودمج مصادر الطاقة المتجددة والذكاء الاصطناعي، إضافةً إلى التعليم الهندسي والنشر الأكاديمي ثنائي اللغة.</p>'

          links = '''
          <div class="about-profile-links" aria-label="Academic profiles | الملفات الأكاديمية">
            <a class="about-profile-link orcid" href="https://orcid.org/0000-0002-3720-7203" target="_blank" rel="me noopener noreferrer">
              <span class="profile-mark" aria-hidden="true">iD</span>
              <span class="profile-copy"><strong>ORCID</strong><small>0000-0002-3720-7203</small></span>
            </a>
            <a class="about-profile-link researchgate" href="https://www.researchgate.net/profile/Aouss-Gabash" target="_blank" rel="noopener noreferrer">
              <span class="profile-mark" aria-hidden="true">RG</span>
              <span class="profile-copy"><strong>ResearchGate</strong><small>Aouss Gabash</small></span>
            </a>
            <a class="about-profile-link archive" href="https://archive.org/details/@aouss_gabash" target="_blank" rel="noopener noreferrer">
              <span class="profile-mark" aria-hidden="true">▰</span>
              <span class="profile-copy"><strong>Archive</strong><small>Digital Library | المكتبة الرقمية</small></span>
            </a>
          </div>'''

          if 'class="about-profile-links"' not in text:
              if marker not in text:
                  raise SystemExit('About marker not found')
              text = text.replace(marker, marker + links, 1)

          text = text.replace('<script src="script.js"></script>', '<script src="script.js?v=20260820-2"></script>')
          path.write_text(text, encoding='utf-8')

      - name: Commit direct HTML update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Insert academic profile links directly in About section"
          git push
