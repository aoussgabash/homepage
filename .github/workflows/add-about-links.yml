name: Update 2016-2018 Career Title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-about-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-career-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update career title in index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<h4>Research Assistant &amp; Seminar Instructor<span class="card-ar" lang="ar" dir="rtl">باحث ومشرف على الندوات العلمية</span></h4>'
          new = '<h4>Research Assistant &amp; Group Leader<span class="card-ar" lang="ar" dir="rtl">باحث ورئيس مجموعة</span></h4>'

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Target career title was not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit career title update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update 2016-2018 role to Research Assistant and Group Leader"
          git push
