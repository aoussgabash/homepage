name: Fix AGPR Coming Next Display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-agpr-coming-next.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-agpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prevent JavaScript from replacing AGPR status
        shell: python
        run: |
          from pathlib import Path

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')

          old_block = """const pressProjectCard = projectCards.find((card) => card.querySelector('.project-code .suffix')?.textContent.trim() === 'PR');
if (pressProjectCard) pressProjectCard.classList.add('press-card-unified');
makeProjectCardLink(
  pressProjectCard,
  'https://press.aoussgabash.com',
  'Open Gabash Academic Press | فتح دار غباش للنشر الأكاديمي'
);
"""
          new_block = """const pressProjectCard = projectCards.find((card) => card.querySelector('.project-code .suffix')?.textContent.trim() === 'PR');
if (pressProjectCard) {
  pressProjectCard.classList.add('press-card-unified');
  pressProjectCard.removeAttribute('role');
  pressProjectCard.removeAttribute('tabindex');
  pressProjectCard.removeAttribute('aria-label');
  delete pressProjectCard.dataset.projectLink;
}
"""

          if old_block not in script:
              raise SystemExit('AGPR link conversion block not found')
          script = script.replace(old_block, new_block, 1)
          script_path.write_text(script, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('script.js?v=20260820-2', 'script.js?v=20260831-1')
          index_path.write_text(index, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-agpr-coming-next.yml
          git add script.js index.html .github/workflows/fix-agpr-coming-next.yml
          git commit -m "Keep AGPR card labeled Coming next"
          git push
