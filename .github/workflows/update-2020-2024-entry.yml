name: Update 2020-2024 Career Entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-2020-2024-entry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update 2020-2024 career description
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_en = '<p>Hybrid systems, fuzzy control, sustainable energy systems and advanced system identification, TU Ilmenau, Ilmenau, Germany.</p>'
          new_en = '<p>Hybrid systems, fuzzy control, sustainable energy systems and advanced system identification, Institute for Automation and Systems Engineering, TU Ilmenau, Ilmenau, Germany.</p>'

          old_ar = '<p class="ar-copy" lang="ar" dir="rtl">الأنظمة الهجينة، والتحكم الضبابي، وأنظمة الطاقة المستدامة، والتعريف المتقدم للأنظمة، جامعة إلميناو التقنية، إلميناو، ألمانيا.</p>'
          new_ar = '<p class="ar-copy" lang="ar" dir="rtl">الأنظمة الهجينة، والتحكم الضبابي، وأنظمة الطاقة المستدامة، والتعريف المتقدم للأنظمة، معهد هندسة الأتمتة والأنظمة، جامعة إلميناو التقنية، إلميناو، ألمانيا.</p>'

          if old_en not in text:
              raise SystemExit('English 2020-2024 description not found')
          if old_ar not in text:
              raise SystemExit('Arabic 2020-2024 description not found')

          text = text.replace(old_en, new_en, 1)
          text = text.replace(old_ar, new_ar, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit website update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-2020-2024-entry.yml
          git add index.html .github/workflows/update-2020-2024-entry.yml
          git commit -m "Update 2020-2024 research position description"
          git push
