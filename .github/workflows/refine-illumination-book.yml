name: Refine illumination book card

on:
  push:
    paths:
      - '.github/workflows/refine-illumination-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update book text and buttons
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Aouss Mahmoud Gabash': 'Aouss Gabash',
              'أوس محمود غباش': 'أوس غباش',
              'Second edition, 2006 (1426 AH)': 'Second edition, 2006',
              'الطبعة الثانية، 2006م (1426هـ)': 'الطبعة الثانية، 2006م',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = re.sub(
              r'\s*<a class="button secondary" href="https://archive\.org/details/@aouss_gabash"[^>]*>Book details \| تفاصيل الكتاب</a>',
              '',
              text,
              count=1
          )

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/refine-illumination-book.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Validate and commit
        run: |
          grep -q 'Arabic engineering textbook by Aouss Gabash' index.html
          grep -q 'كتاب هندسي عربي من تأليف أوس غباش' index.html
          ! grep -q '1426 AH' index.html
          ! grep -q '1426هـ' index.html
          ! grep -q 'Book details | تفاصيل الكتاب' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Refine illumination book information"
            git push
          fi
