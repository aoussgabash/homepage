name: Update 2002-2003 Engineering Office

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-2002-2003-office.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add engineering office name to 2002-2003 entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_en = '<p>Low- and medium-voltage networks, lighting and electronic security systems, Aleppo, Syria.</p>'
          new_en = '<p>Low- and medium-voltage networks, lighting and electronic security systems, Al Hilal for Industrial Systems Engineering Office, Aleppo, Syria.</p>'

          old_ar = '<p class="ar-copy" lang="ar" dir="rtl">شبكات الجهد المنخفض والمتوسط، والإنارة، وأنظمة الأمن الإلكتروني، حلب، سوريا.</p>'
          new_ar = '<p class="ar-copy" lang="ar" dir="rtl">شبكات الجهد المنخفض والمتوسط، والإنارة، وأنظمة الأمن الإلكتروني، مكتب الهلال للأنظمة الصناعية، حلب، سوريا.</p>'

          if old_en not in text:
              raise SystemExit('English 2002-2003 description not found')
          if old_ar not in text:
              raise SystemExit('Arabic 2002-2003 description not found')

          text = text.replace(old_en, new_en, 1)
          text = text.replace(old_ar, new_ar, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit website update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-2002-2003-office.yml
          git add index.html .github/workflows/update-2002-2003-office.yml
          git commit -m "Add Al Hilal engineering office to 2002-2003 experience"
          git push
