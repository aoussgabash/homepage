name: Unify global footer

on:
  push:
    paths:
      - '.github/workflows/unify-global-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize footer in all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer_inner = '''
            <div class="container footer-wrap ag-global-footer">
              <span>© 2026 Dr.-Ing. Aouss Gabash | <span lang="ar" dir="rtl">الدكتور المهندس أوس غباش</span></span>
              <span>AG Academic Ecosystem | <span lang="ar" dir="rtl">منظومة AG الأكاديمية</span></span>
              <span>Germany | <span lang="ar" dir="rtl">ألمانيا</span> • Syria | <span lang="ar" dir="rtl">سوريا</span></span>
            </div>
          '''

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js'} or '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              original = text
              text = re.sub(
                  r'(<footer\b[^>]*>)[\s\S]*?(</footer>)',
                  lambda m: m.group(1) + footer_inner + m.group(2),
                  text,
                  flags=re.I
              )
              text = re.sub(r'Ilmenau,?\s*Germany[\s\S]{0,180}?Homs,?\s*Syria', 'Germany | ألمانيا • Syria | سوريا', text, flags=re.I)
              text = re.sub(r'إلميناو،?\s*ألمانيا[\s\S]{0,180}?حمص،?\s*سوريا', 'ألمانيا • سوريا', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No footer files were changed')
          print('\n'.join(changed))
          PY
      - name: Validate and commit
        run: |
          grep -q 'Germany' index.html
          grep -q 'Syria' index.html
          ! grep -q 'Ilmenau, Germany' index.html
          ! grep -q 'Homs, Syria' index.html
          rm -f .github/workflows/unify-global-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify footer and retain country names only"
          git push
