name: Add English published book

on:
  push:
    paths:
      - '.github/workflows/add-english-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert English book card
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'class="published-english-book-card"' not in text:
              pattern = r'(<article class="published-book-card"[\s\S]*?</article>)'
              match = re.search(pattern, text, flags=re.I)
              if not match:
                  raise SystemExit('Published Arabic book card was not found.')

              card = '''
          <article class="published-english-book-card" style="border-color:rgba(56,189,248,.48);background:linear-gradient(180deg,#ffffff,#f4faff)">
            <span>Published · English · 2014 | <span lang="ar" dir="rtl">منشور · باللغة الإنجليزية · 2014</span></span>
            <h3>Flexible Optimal Operations of Energy Supply Networks<span class="card-ar" lang="ar" dir="rtl">التشغيل الأمثل المرن لشبكات إمداد الطاقة</span></h3>
            <p><strong>With Renewable Energy Generation and Battery Storage.</strong> An academic monograph on the flexible optimal operation of energy supply networks with renewable generation and battery storage integration.</p>
            <p class="ar-copy" lang="ar" dir="rtl"><strong>مع توليد الطاقة المتجددة وتخزين البطاريات.</strong> كتاب أكاديمي حول التشغيل الأمثل المرن لشبكات إمداد الطاقة ودمج مصادر الطاقة المتجددة وأنظمة تخزين البطاريات.</p>
            <p><strong>Author:</strong> Aouss Gabash · <strong>Language:</strong> English · <strong>ISBN-10:</strong> 3838138384 · <strong>ISBN-13:</strong> 978-3838138387</p>
            <p class="ar-copy" lang="ar" dir="rtl"><strong>المؤلف:</strong> أوس غباش · <strong>اللغة:</strong> الإنجليزية · <strong>الرقم الدولي:</strong> 978-3838138387</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
              <a class="button primary" href="https://www.amazon.de/dp/3838138384" target="_blank" rel="noopener noreferrer">View on Amazon | العرض على أمازون</a>
            </div>
          </article>
              '''

              text = text[:match.end()] + card + text[match.end():]

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/add-english-book.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Validate and commit
        run: |
          grep -q 'published-english-book-card' index.html
          grep -q 'Flexible Optimal Operations of Energy Supply Networks' index.html
          grep -q 'https://www.amazon.de/dp/3838138384' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add English published book to homepage"
            git push
          fi
