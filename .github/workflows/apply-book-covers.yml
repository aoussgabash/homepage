name: Apply original book covers

on:
  push:
    paths:
      - '.github/workflows/apply-book-covers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply book covers
        run: python3 tools/apply_book_covers.py
      - name: Validate and commit
        run: |
          grep -q 'assets/books/illumination-front.jpg' index.html
          grep -q 'assets/books/illumination-back.jpg' index.html
          grep -q 'assets/books/flexible-optimal-operations-front.jpg' index.html
          grep -q 'assets/books/flexible-optimal-operations-back.jpg' index.html
          grep -q 'published-book-gallery-script' index.html
          rm -f .github/workflows/apply-book-covers.yml tools/apply_book_covers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Display original front and back book covers"
          git push

# Retriggered after correcting gallery validation.
