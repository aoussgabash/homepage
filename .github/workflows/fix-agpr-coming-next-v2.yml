name: Fix AGPR Coming Next V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-agpr-coming-next-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add final AGPR label override
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          external_pattern = r'<script src="script\.js(?:\?v=[^"]*)?"></script>'
          external_match = re.search(external_pattern, text)
          if not external_match:
              raise SystemExit('Main script tag not found')

          fix_script = '''<script id="agpr-coming-next-fix">
          (() => {
            const cards = [...document.querySelectorAll('#projects .project-card')];
            const card = cards.find((item) => item.querySelector('.project-code .suffix')?.textContent.trim() === 'PR');
            if (!card) return;
            const label = card.querySelector('.card-link, .status');
            if (label) {
              label.className = 'status';
              label.innerHTML = 'Coming next | <span lang="ar" dir="rtl">قريباً</span>';
            }
            card.style.cursor = 'default';
            card.style.pointerEvents = 'none';
            card.removeAttribute('role');
            card.removeAttribute('tabindex');
            card.removeAttribute('aria-label');
            delete card.dataset.projectLink;
          })();
          </script>'''

          text = re.sub(r'\n?<script id="agpr-coming-next-fix">[\s\S]*?</script>', '', text, count=1)
          updated_tag = '<script src="script.js?v=20260831-2"></script>\n' + fix_script
          text = re.sub(external_pattern, updated_tag, text, count=1)
          path.write_text(text, encoding='utf-8')

      - name: Commit final correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-agpr-coming-next-v2.yml
          git rm -f .github/workflows/fix-agpr-coming-next.yml || true
          git add index.html
          git commit -m "Fix AGPR Coming next label permanently"
          git push
