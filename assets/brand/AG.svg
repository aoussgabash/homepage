<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
<title id="title">AG</title>
<desc id="desc">Simplified AG master logo with two circular rings.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fde68a"/>
    <stop offset=".5" stop-color="#fbbf24"/>
    <stop offset="1" stop-color="#d97706"/>
  </linearGradient>
</defs>
<rect width="300" height="300" rx="36" fill="#07111f"/>
<circle cx="150" cy="150" r="108" fill="#0b1c31" stroke="#38bdf8" stroke-width="5"/>
<circle cx="150" cy="150" r="90" fill="none" stroke="#fbbf24" stroke-width="4"/>
<text x="72" y="191" font-family="Arial,Helvetica,sans-serif" font-size="126" font-weight="900" fill="url(#gold)">A</text>
<text x="145" y="191" font-family="Arial,Helvetica,sans-serif" font-size="126" font-weight="900" fill="url(#blue)">G</text>
</svg>